# ─────────────────────────────────────────────────────────────
#  MIRA  –  Docker Compose
#  Neon (cloud PostgreSQL) — no local db container needed.
# ─────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── FastAPI Backend ───────────────────────────────────────
  # Build context is the PROJECT ROOT so the Dockerfile can
  # access both requirements.txt and the backend/ package.
  backend:
    build:
      context: .                        # <-- project root (MIRA/)
      dockerfile: backend/Dockerfile    # Dockerfile lives inside backend/
    container_name: mira_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend          # live-reload: edits reflect instantly

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mira_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
