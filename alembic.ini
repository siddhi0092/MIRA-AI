# alembic.ini
# Alembic configuration file for MIRA.
# The actual database URL is injected at runtime from the environment
# via env.py — the sqlalchemy.url value here is a placeholder that
# env.py overrides before any migration runs.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden in alembic/env.py from settings.DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://user:pass@host/db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
